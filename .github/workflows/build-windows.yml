name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ykv_transform/**"
      - "gui_main.py"
      - "packaging/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build app and installer
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: YKVTransform-Setup-x64
          path: dist/installer/YKVTransform-Setup-x64.exe

      - name: Upload portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: YKVTransform-portable
          path: dist/YKVTransform/
